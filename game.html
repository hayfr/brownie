<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Brownie Stacker | The Brownie Bite</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍫</text></svg>">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">History</a></li>
            <li><a href="recipe.html">Recipe</a></li>
            <li><a href="game.html">Game</a></li>
        </ul>
    </nav>
    <main class="container">
        <section class="card game-container">
            <h1>Brownie Stacker</h1>
            <p>Press the button or spacebar to drop each moving brownie. Try to build the tallest tower possible.</p>
            <div class="game-info">
                <span>Score: <span id="score">0</span></span>
                <span>Best: <span id="best">0</span></span>
            </div>
            <canvas id="gameCanvas" width="400" height="500"></canvas>
            <p id="message">Press start to begin.</p>
            <button class="btn" id="actionBtn">Start Game</button>
        </section>
    </main>
    <footer>
        <p>The Brownie Bite © 2026</p>
    </footer>
    <script>
        const canvas=document.getElementById("gameCanvas");
        const ctx=canvas.getContext("2d");
        const scoreText=document.getElementById("score");
        const bestText=document.getElementById("best");
        const message=document.getElementById("message");
        const actionBtn=document.getElementById("actionBtn");
        const blockHeight=24;
        const depth=12;
        const step=36;
        let blocks=[];
        let current;
        let score=0;
        let best=Number(localStorage.getItem("brownieBest"))||0;
        let state="start";
        let scroll=0;
        bestText.textContent=best;
        class Brownie{
            constructor(x,y,width,direction,speed){
                this.x=x;
                this.y=y;
                this.width=width;
                this.direction=direction;
                this.speed=speed;
            }
            update(){
                this.x+=this.speed*this.direction;
                if(this.x<=0){
                    this.x=0;
                    this.direction=1;
                }
                if(this.x+this.width+depth>=canvas.width){
                    this.x=canvas.width-this.width-depth;
                    this.direction=-1;
                }
            }
            draw(){
                const x=this.x;
                const y=this.y+scroll;
                const w=this.width;
                ctx.fillStyle="#3a1a10";
                ctx.beginPath();
                ctx.moveTo(x,y);
                ctx.lineTo(x+depth,y+depth);
                ctx.lineTo(x+depth,y+depth+blockHeight);
                ctx.lineTo(x,y+blockHeight);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle="#241009";
                ctx.stroke();
                ctx.fillStyle="#4d2416";
                ctx.beginPath();
                ctx.moveTo(x+depth,y+depth);
                ctx.lineTo(x+w+depth,y+depth);
                ctx.lineTo(x+w+depth,y+depth+blockHeight);
                ctx.lineTo(x+depth,y+depth+blockHeight);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle="#78432b";
                ctx.beginPath();
                ctx.moveTo(x,y);
                ctx.lineTo(x+w,y);
                ctx.lineTo(x+w+depth,y+depth);
                ctx.lineTo(x+depth,y+depth);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                const chips=Math.max(1,Math.floor(w/45));
                for(let i=0;i<chips;i++){
                    const chipX=x+(i+1)*w/(chips+1)+depth/2;
                    const chipY=y+5+(i%2)*4;
                    ctx.fillStyle="#2b130c";
                    ctx.beginPath();
                    ctx.ellipse(chipX,chipY,3,2,0,0,Math.PI*2);
                    ctx.fill();
                }
                if(w>65){
                    ctx.strokeStyle="#4a2418";
                    ctx.lineWidth=2;
                    ctx.beginPath();
                    ctx.moveTo(x+w*.42,y+3);
                    ctx.lineTo(x+w*.48,y+7);
                    ctx.lineTo(x+w*.44,y+11);
                    ctx.stroke();
                }
            }
        }
        function startGame(){
            blocks=[];
            score=0;
            scroll=0;
            scoreText.textContent=score;
            blocks.push(new Brownie(94,440,200,0,0));
            state="playing";
            message.textContent="";
            actionBtn.textContent="Drop Brownie";
            spawnBlock();
        }
        function spawnBlock(){
            const last=blocks[blocks.length-1];
            const direction=score%2===0?1:-1;
            const x=direction===1?0:canvas.width-last.width-depth;
            const speed=Math.min(2+score*.15,5);
            current=new Brownie(x,last.y-step,last.width,direction,speed);
            if(current.y+scroll<110)scroll+=step;
        }
        function dropBlock(){
            const last=blocks[blocks.length-1];
            let start=Math.max(current.x,last.x);
            let end=Math.min(current.x+current.width,last.x+last.width);
            let overlap=end-start;
            if(overlap<=3){
                state="gameover";
                message.textContent="The brownie missed the tower!";
                actionBtn.textContent="Try Again";
                return;
            }
            if(Math.abs(current.x-last.x)<5){
                start=last.x;
                overlap=last.width;
                message.textContent="Perfect drop!";
            }else{
                message.textContent="";
            }
            current.x=start;
            current.width=overlap;
            current.speed=0;
            blocks.push(current);
            score++;
            scoreText.textContent=score;
            if(score>best){
                best=score;
                bestText.textContent=best;
                localStorage.setItem("brownieBest",best);
            }
            spawnBlock();
        }
        function drawBackground(){
            ctx.fillStyle="#f5e7d6";
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.strokeStyle="rgba(109,61,37,.12)";
            ctx.lineWidth=1;
            for(let y=0;y<canvas.height;y+=40){
                ctx.beginPath();
                ctx.moveTo(0,y);
                ctx.lineTo(canvas.width,y);
                ctx.stroke();
            }
            ctx.fillStyle="#d5ad82";
            ctx.fillRect(0,475,canvas.width,25);
        }
        function gameLoop(){
            drawBackground();
            blocks.forEach(block=>block.draw());
            if(current){
                if(state==="playing")current.update();
                current.draw();
            }
            if(state==="start"){
                ctx.fillStyle="#5a2f1d";
                ctx.font="bold 20px Trebuchet MS";
                ctx.textAlign="center";
                ctx.fillText("Press Start to Build",canvas.width/2,canvas.height/2);
            }
            requestAnimationFrame(gameLoop);
        }
        function handleAction(){
            if(state==="start"||state==="gameover")startGame();
            else dropBlock();
        }
        actionBtn.addEventListener("click",handleAction);
        window.addEventListener("keydown",e=>{
            if(e.code==="Space"){
                e.preventDefault();
                handleAction();
            }
        });
        gameLoop();
    </script>
</body>
</html>
