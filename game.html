<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brownie Tower Game | The Brownie Bite</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍫</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav>
        <ul>
            <li><a href="index.html">History & Facts</a></li>
            <li><a href="recipe.html">The Ultimate Recipe</a></li>
            <li><a href="game.html">Brownie Tower Game</a></li>
        </ul>
    </nav>

    <div class="container fade-in">
        <div class="card game-container">
            <h1>Brownie Stacker</h1>
            <p>Stack the brownie slabs as high as you can! Click the button or press <strong>Spacebar</strong> to drop the sliding slab. Time it perfectly to avoid losing pieces of your brownie.</p>
            
            <h2 style="margin-top: 1rem;">Score: <span id="score">0</span></h2>
            
            <canvas id="gameCanvas" width="400" height="500"></canvas>
            
            <button class="btn" id="actionBtn">Start / Drop Brownie</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const actionBtn = document.getElementById('actionBtn');

        // Game state
        let state = 'start'; // start, playing, gameover
        let score = 0;
        let blocks = [];
        let currentBlock;
        let scrollY = 0;

        // Block settings
        const blockHeight = 30;
        const speedMultiplier = 0.2;

        // Audio Context (Synthesized Sounds)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'drop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'over') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        class Block {
            constructor(x, y, width, direction, speed) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = blockHeight;
                this.direction = direction;
                this.speed = speed;
                this.color = `#${Math.floor(Math.random()*2 + 3)}C1${Math.floor(Math.random()*4 + 2)}03`; // Random shades of chocolate
            }

            draw() {
                // Draw base brownie
                ctx.fillStyle = '#3d1c00'; // Dark choc
                ctx.fillRect(this.x, this.y + scrollY, this.width, this.height);
                
                // Draw lighter chocolate frosting top
                ctx.fillStyle = '#5c2a00';
                ctx.fillRect(this.x, this.y + scrollY, this.width, this.height - 5);
                
                // Outline
                ctx.strokeStyle = '#2C1203';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, this.y + scrollY, this.width, this.height);
            }

            update() {
                this.x += this.speed * this.direction;
                if (this.x <= 0 || this.x + this.width >= canvas.width) {
                    this.direction *= -1; // Reverse direction on wall hit
                }
            }
        }

        function initGame() {
            blocks = [];
            score = 0;
            scrollY = 0;
            scoreElement.innerText = score;
            
            // Base block
            blocks.push(new Block(100, canvas.height - blockHeight, 200, 0, 0));
            
            spawnBlock();
            state = 'playing';
            actionBtn.innerText = "Drop Brownie!";
            gameLoop();
        }

        function spawnBlock() {
            let lastBlock = blocks[blocks.length - 1];
            let yPos = lastBlock.y - blockHeight;
            let speed = 2 + (score * speedMultiplier); // Gets faster
            currentBlock = new Block(0, yPos, lastBlock.width, 1, speed);
            
            // Pan camera up if getting too high
            if (yPos + scrollY < 150) {
                scrollY += blockHeight;
            }
        }

        function placeBlock() {
            playSound('drop');
            let lastBlock = blocks[blocks.length - 1];
            
            // Calculate overlap
            let overlapStart = Math.max(currentBlock.x, lastBlock.x);
            let overlapEnd = Math.min(currentBlock.x + currentBlock.width, lastBlock.x + lastBlock.width);
            let overlapWidth = overlapEnd - overlapStart;

            if (overlapWidth <= 0) {
                // Missed completely
                state = 'gameover';
                playSound('over');
                actionBtn.innerText = "Game Over - Try Again";
                return;
            }

            // Cut the block
            currentBlock.x = overlapStart;
            currentBlock.width = overlapWidth;
            currentBlock.speed = 0; // Stop moving
            
            blocks.push(currentBlock);
            score++;
            scoreElement.innerText = score;
            
            spawnBlock();
        }

        function drawBackground() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Draw grid lines for clean layout feel
            ctx.strokeStyle = 'rgba(139, 90, 51, 0.1)';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let i=0; i<canvas.height; i+=40) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }
        }

        function gameLoop() {
            if (state !== 'playing') return;
            
            drawBackground();
            
            blocks.forEach(b => b.draw());
            
            currentBlock.update();
            currentBlock.draw();
            
            requestAnimationFrame(gameLoop);
        }

        // Event Listeners
        function handleAction() {
            if (state === 'start' || state === 'gameover') {
                initGame();
            } else if (state === 'playing') {
                placeBlock();
            }
        }

        actionBtn.addEventListener('click', handleAction);
        
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                handleAction();
            }
        });

        // Initial draw
        drawBackground();
        ctx.fillStyle = '#4A2511';
        ctx.font = '20px Poppins';
        ctx.textAlign = 'center';
        ctx.fillText("Press Start to Bake the Tower", canvas.width/2, canvas.height/2);

    </script>
</body>
</html>
