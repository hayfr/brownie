<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Brownie Bite | Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">History</a></li>
            <li><a href="recipe.html">Recipe</a></li>
            <li><a href="game.html">Stack Game</a></li>
        </ul>
    </nav>

    <div class="container" style="text-align: center;">
        <div class="game-container">
            <div class="game-ui">
                <p>All-Time High: <span id="high-score">0</span></p>
                <h3 id="current-score-label">Your Score:</h3>
                <h1 id="score">0</h1>
            </div>
            <canvas id="gameCanvas"></canvas>
        </div>
        <button class="btn" onclick="startGame()">Start / Stack Brownie</button>
    </div>

    <script src="transition.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');

        // Load High Score
        let highScore = localStorage.getItem('brownieStackHigh') || 0;
        highScoreEl.innerText = highScore;

        let stack = [];
        let current = {};
        let mode = 'waiting';
        let speed = 2;

        function startGame() {
            if(mode === 'waiting' || mode === 'over') {
                stack = [{ x: 0, y: 0, w: 150, h: 150, c: '#3d1c02' }];
                newBlock();
                mode = 'playing';
            } else {
                placeBlock();
            }
        }

        function newBlock() {
            const last = stack[stack.length - 1];
            current = { 
                x: -150, 
                y: stack.length * -25, 
                w: last.w, 
                h: last.h, 
                dir: 1 
            };
        }

        function placeBlock() {
            const last = stack[stack.length - 1];
            const diff = current.x - last.x;
            
            if (Math.abs(diff) >= current.w) {
                mode = 'over';
                if(stack.length-1 > highScore) {
                    highScore = stack.length-1;
                    localStorage.setItem('brownieStackHigh', highScore);
                    highScoreEl.innerText = highScore;
                }
                alert("The brownie fell! Score: " + (stack.length-1));
                return;
            }

            // Slice block
            if(diff > 0) current.w -= diff;
            else { current.w += diff; current.x = last.x; }

            stack.push({...current, c: '#4e2a0f'});
            scoreEl.innerText = stack.length - 1;
            newBlock();
        }

        // ISOMETRIC DRAWING MATH
        function drawIsoBox(x, y, z, w, h, color) {
            // Transform coordinates to Isometric angle
            const isoX = (x - z) + canvas.width/2;
            const isoY = (x + z) / 2 + y + 350;

            const height = 25; // thickness of brownie

            // Right Face
            ctx.fillStyle = '#2C1203';
            ctx.beginPath();
            ctx.moveTo(isoX, isoY);
            ctx.lineTo(isoX + w, isoY - w/2);
            ctx.lineTo(isoX + w, isoY - w/2 + height);
            ctx.lineTo(isoX, isoY + height);
            ctx.fill();

            // Left Face
            ctx.fillStyle = '#3d1c02';
            ctx.beginPath();
            ctx.moveTo(isoX, isoY);
            ctx.lineTo(isoX - h, isoY - h/2);
            ctx.lineTo(isoX - h, isoY - h/2 + height);
            ctx.lineTo(isoX, isoY + height);
            ctx.fill();

            // Top Face (The Brownie Surface)
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(isoX, isoY);
            ctx.lineTo(isoX + w, isoY - w/2);
            ctx.lineTo(isoX + w - h, isoY - (w + h)/2);
            ctx.lineTo(isoX - h, isoY - h/2);
            ctx.fill();
        }

        function loop() {
            ctx.clearRect(0,0,400,500);
            
            if(mode === 'playing') {
                current.x += speed * current.dir;
                if(current.x > 150 || current.x < -150) current.dir *= -1;
            }

            // Draw stack
            stack.forEach((b, i) => {
                const color = i === 0 ? '#2C1203' : '#4e2a0f';
                drawIsoBox(b.x, b.y, 0, b.w, b.h, color);
            });

            if(mode === 'playing') {
                drawIsoBox(current.x, current.y, 0, current.w, current.h, '#6d3d1e');
            }

            requestAnimationFrame(loop);
        }

        canvas.width = 400;
        canvas.height = 500;
        loop();
    </script>
</body>
</html>
