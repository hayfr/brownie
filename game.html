<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Brownie Stacker</title>
    <style>
        html{background:#f5e7d6}
        body{margin:0;opacity:1!important;transform:none!important}
        html:not(.styles-loaded) body>*:not(#pageCover){visibility:hidden}
        #pageCover{
            position:fixed;
            inset:0;
            z-index:9999;
            display:grid;
            place-items:center;
            background:#f5e7d6;
            opacity:1;
            transition:opacity .12s ease;
        }
        html.styles-loaded:not(.leaving) #pageCover{
            opacity:0;
            pointer-events:none;
        }
        html.leaving #pageCover{
            opacity:1;
            pointer-events:auto;
        }
        .cookie-loader{
            display:flex;
            gap:10px;
        }
        .cookie-loader span{
            display:block;
            font-size:28px;
            animation:cookieFall .4s ease-in-out infinite alternate;
        }
        .cookie-loader span:nth-child(2){animation-delay:.1s}
        .cookie-loader span:nth-child(3){animation-delay:.2s}
        @keyframes cookieFall{
            from{transform:translateY(-10px) rotate(-10deg)}
            to{transform:translateY(10px) rotate(10deg)}
        }
    </style>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍫</text></svg>">
    <link rel="stylesheet" href="styles.css" onload="document.documentElement.classList.add('styles-loaded')" onerror="document.documentElement.classList.add('styles-loaded')">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="pageCover">
        <div class="cookie-loader">
            <span>🍪</span>
            <span>🍪</span>
            <span>🍪</span>
        </div>
    </div>
    <nav>
        <ul>
            <li><a href="index.html">Brownies</a></li>
            <li><a href="recipe.html">Recipe</a></li>
            <li><a href="game.html">Game</a></li>
        </ul>
    </nav>
    <main class="container">
        <section class="card game-container">
            <h1>Brownie Stacker</h1>
            <p>Press the button or spacebar to drop each brownie. Try to stack them as high as possible.</p>
            <div class="game-info">
                <span>Score: <span id="score">0</span></span>
                <span>Best: <span id="best">0</span></span>
            </div>
            <canvas id="gameCanvas" width="400" height="500"></canvas>
            <p id="message">Press start to begin.</p>
            <button class="btn" id="actionBtn">Start Game</button>
        </section>
    </main>
    <footer>
        <p>Brownies &gt; Cookies</p>
    </footer>
</body>
</html>
